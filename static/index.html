<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnomalyShield · Safer chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <header><div><p class="eyebrow">MULTILINGUAL MODERATION</p><h1>Anomaly<span>Shield</span></h1></div><button id="reset" class="text-button">Reset demo</button></header>
    <section class="status"><div class="status-dot"></div><div><strong id="status-title">Model moderation active</strong><p id="status-copy">Trained on English and বাংলা harmful-speech datasets.</p></div><div class="count"><b id="violations">0</b><span>violations</span></div></section>
    <section id="chat" class="chat" aria-live="polite"><article class="bubble bot">Hi! I’m here to keep the conversation respectful. Send a message to begin.</article></section>
    <section class="composer"><label for="message">Your message</label><div class="input-row"><textarea id="message" maxlength="1000" placeholder="Write in English, বাংলা, or both…"></textarea><button id="send">Send <span>↗</span></button></div><p class="hint">Unsafe messages are blocked. Repeated violations lead to a timed cooldown.</p></section>
  </main>
  <script src="/static/app.js"></script>
</body></html>
